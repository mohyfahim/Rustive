server {
  listen 443 ssl;
  server_name podbox.plus;
  ssl_certificate /home/orangepi/services/cert/fullchain.crt.pem;
  ssl_certificate_key /home/orangepi/services/cert/privkey.pem;

  #  proxy_max_temp_file_size 0;
  # client_body_buffer_size 10M;

  root /home/orangepi/services/pwa;
  index index.html index.htm;

  client_max_body_size 120M;

  #limit_req zone=pwa_req_limit burst=20 nodelay;

  # proxy_connect_timeout 60s;
  # proxy_read_timeout 60;
  # proxy_send_timeout 60;

  # location /user-guide {
  #     return 301 http://192.168.2.2:1368/user-guide$is_args$args;
  # }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:manifest|appcache|html?|xml|json)$ {
    expires -1;
  }

  location ~* \.(?:css|js)$ {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    #keepalive_timeout 65;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public";
  }

  
  # Any route containing a file extension (e.g. /devicesfile.js)
  location ~ ^.+\..+$ {
    try_files $uri =404;
  }



}


server {
  listen 443 ssl;
  server_name api.podbox.plus;

  ssl_certificate /home/orangepi/services/cert/fullchain.crt.pem;
  ssl_certificate_key /home/orangepi/services/cert/privkey.pem;


  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://localhost:8000;
    proxy_redirect off;
    # limit_req zone=api_req_limit burst=10 nodelay;
  }

}

server {
  listen 443 ssl;
  server_name assets.podbox.plus;

  ssl_certificate /home/orangepi/services/cert/fullchain.crt.pem;
  ssl_certificate_key /home/orangepi/services/cert/privkey.pem;

  limit_rate 1m;
  # limit_rate_after 2m;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  # keepalive_timeout 65;

  location / {
    # limit_req zone=assets_req_limit burst=10 nodelay;
    root /home/orangepi/assets/;
    autoindex off;
    add_header Accept-Ranges bytes;
    # Increase buffer sizes for large video files
    client_body_buffer_size 8M;
    client_max_body_size 500M; # Adjust as needed for your largest file size

    expires 1y;
    add_header Cache-Control "public, immutable";

    # Secure headers
    add_header Content-Security-Policy "default-src 'self'";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Access-Control-Allow-Origin "https://podbox.plus";
  }
}

server {
  # limit_req zone=api_req_limit burst=10 nodelay;
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}


server {
  listen 8080;
  server_name _;
  default_type application/json;
  return 200 '{"mac":null}';
}
